<!doctype html><meta charset="utf-8"><title>phone frame for screenshots</title>
<style>html,body{margin:0;background:#fff}iframe{border:0;display:block}</style>
<iframe id="f"></iframe>
<script>
const q = new URLSearchParams(location.search), f = document.getElementById("f");
f.width = q.get("w") || 390; f.height = q.get("h") || 844; q.delete("w"); q.delete("h");
f.src = "../index.html?" + q.toString();
</script>
